name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Invoke
        run: pip install invoke

      - name: Generate Translations
        run: invoke translate

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Increase Gradle Heap Size via Python
        run: |
          python -c "
          path = 'android/gradle.properties'
          with open(path, 'r') as f:
              content = f.read()
          lines = [l for l in content.splitlines() if 'org.gradle.jvmargs' not in l]
          clean_content = '\n'.join(lines) + '\n'
          clean_content += 'org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError\n'
          with open(path, 'w') as f:
              f.write(clean_content)
          "

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
