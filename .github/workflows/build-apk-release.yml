name: Build APK Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Hard Clean)
        run: |
          echo "=== Speicherplatz vor dem Aufräumen ==="
          df -h
          
          # Entferne ungenutzte große Softwarepakete des GitHub-Images
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/chromium"
          sudo rm -rf "/usr/local/lib/node_modules"
          
          echo "=== Speicherplatz nach dem Aufräumen ==="
          df -h

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Invoke
        run: pip install invoke

      - name: Generate Translations
        run: invoke translate

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Increase Gradle Heap Size via Python
        run: |
          python -c "
          path = 'android/gradle.properties'
          with open(path, 'r') as f:
              content = f.read()
          lines = [l for l in content.splitlines() if 'org.gradle.jvmargs' not in l]
          clean_content = '\n'.join(lines) + '\n'
          clean_content += 'org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError\n'
          with open(path, 'w') as f:
              f.write(clean_content)
          "

      - name: Generate Keystore Directly
        run: |
          keytool -genkey -v -keystore android/app/keystore.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias inventree-release-key -storepass inventreepass123 -keypass inventreepass123 \
            -dname "CN=InvenTree, OU=None, O=None, L=None, S=None, C=DE"

      - name: Create key.properties Config
        run: |
          cat <<EOF > android/key.properties
          storePassword=inventreepass123
          keyPassword=inventreepass123
          keyAlias=inventree-release-key
          storeFile=keystore.jks
          EOF

      - name: Build Release APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: inventree-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
